[package]
name = "astrorust"
version = "1.0.1"
edition = "2021"
authors = ["Dominik", "Astrorust Contributors"]
description = "Open-Source Astrologie- und Ephemeriden-Software inspiriert von Astroplus, umgesetzt in Rust und Qt6"
license = "GPL-3.0-or-later"
repository = "https://github.com/DomiLuebben/astrorust"

[lib]
name = "astrorust"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "astrorust"
path = "src/main.rs"

[dependencies]
sweph = "0.3.0"
sweph-sys = "0.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
